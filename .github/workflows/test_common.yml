name: common

on:
  workflow_call:

env:
  RUNTIME__LOG_LEVEL: ERROR

  # we need the secrets only for the rest_api_pipeline tests which are in tests/sources
  # so we inject them only at the end
  SOURCES__GITHUB__ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # and also for the github_api_pipeline tests
  SOURCES__GITHUB_API_PIPELINE__ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  run_common:
    # Job title: matrix.display_name + optional "-{N}vcpu" (runner image is matrix.os only).
    name: ${{ matrix.display_name }}${{ matrix.vcpus && format('-{0}vcpu', matrix.vcpus) || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:

          # macos tests
          - display_name: macos-3.11-common/pipeline-mindeps-workspace
            vcpus: 12
            os: blacksmith-12vcpu-macos-latest
            platform: macos
            python-version: "3.11"
            shell: bash
            suite: common/pipeline-mindeps-workspace
          - display_name: macos-3.11-pipeline-full
            vcpus: 12
            os: blacksmith-12vcpu-macos-latest
            platform: macos
            python-version: "3.11"
            shell: bash
            suite: pipeline-full
          - display_name: macos-3.11-sqlalchemy-2
            vcpus: 12
            os: blacksmith-12vcpu-macos-latest
            platform: macos
            python-version: "3.11"
            shell: bash
            suite: sqlalchemy-2

          # linux tests
          - display_name: linux-3.10-common/pipeline-mindeps-workspace
            vcpus: 8
            os: blacksmith-8vcpu-ubuntu-2404
            platform: linux
            python-version: "3.10"
            shell: bash
            suite: common/pipeline-mindeps-workspace
          - display_name: linux-3.10-pipeline-full
            vcpus: 8
            os: blacksmith-8vcpu-ubuntu-2404
            platform: linux
            python-version: "3.10"
            shell: bash
            suite: pipeline-full
          - display_name: linux-3.10-sqlalchemy-2
            vcpus: 8
            os: blacksmith-8vcpu-ubuntu-2404
            platform: linux
            python-version: "3.10"
            shell: bash
            suite: sqlalchemy-2
          - display_name: linux-3.11-common/pipeline-mindeps-workspace
            vcpus: 8
            os: blacksmith-8vcpu-ubuntu-2404
            platform: linux
            python-version: "3.11"
            shell: bash
            suite: common/pipeline-mindeps-workspace
          - display_name: linux-3.11-pipeline-full
            vcpus: 8
            os: blacksmith-8vcpu-ubuntu-2404
            platform: linux
            python-version: "3.11"
            shell: bash
            suite: pipeline-full
          - display_name: linux-3.11-sqlalchemy-2
            vcpus: 8
            os: blacksmith-8vcpu-ubuntu-2404
            platform: linux
            python-version: "3.11"
            shell: bash
            suite: sqlalchemy-2
          - display_name: linux-3.12-common/pipeline-mindeps-workspace
            vcpus: 8
            os: blacksmith-8vcpu-ubuntu-2404
            platform: linux
            python-version: "3.12"
            shell: bash
            suite: common/pipeline-mindeps-workspace
          - display_name: linux-3.12-pipeline-full
            vcpus: 8
            os: blacksmith-8vcpu-ubuntu-2404
            platform: linux
            python-version: "3.12"
            shell: bash
            suite: pipeline-full
          - display_name: linux-3.12-sqlalchemy-2
            vcpus: 8
            os: blacksmith-8vcpu-ubuntu-2404
            platform: linux
            python-version: "3.12"
            shell: bash
            suite: sqlalchemy-2
          - display_name: linux-3.13-common/pipeline-mindeps-workspace
            vcpus: 8
            os: blacksmith-8vcpu-ubuntu-2404
            platform: linux
            python-version: "3.13"
            shell: bash
            suite: common/pipeline-mindeps-workspace
          - display_name: linux-3.13-pipeline-full
            vcpus: 8
            os: blacksmith-8vcpu-ubuntu-2404
            platform: linux
            python-version: "3.13"
            shell: bash
            suite: pipeline-full
          - display_name: linux-3.13-sqlalchemy-2
            vcpus: 8
            os: blacksmith-8vcpu-ubuntu-2404
            platform: linux
            python-version: "3.13"
            shell: bash
            suite: sqlalchemy-2

          # 3.14: early suite only (no pipeline-full / sqlalchemy-2 tail)
          - display_name: macos-3.14-common/pipeline-mindeps-workspace
            vcpus: 12
            os: blacksmith-12vcpu-macos-latest
            platform: macos
            python-version: "3.14"
            shell: bash
            suite: common/pipeline-mindeps-workspace

          # linux test with minimal dependencies
          - display_name: linux-lowest-direct-3.11-common/pipeline-mindeps-workspace
            vcpus: 8
            os: blacksmith-8vcpu-ubuntu-2404
            platform: linux-lowest-direct
            python-version: "3.11"
            shell: bash
            uv_sync_args: '--resolution lowest-direct' # could also be 'direct'
            suite: common/pipeline-mindeps-workspace
          - display_name: linux-lowest-direct-3.11-pipeline-full
            vcpus: 8
            os: blacksmith-8vcpu-ubuntu-2404
            platform: linux-lowest-direct
            python-version: "3.11"
            shell: bash
            uv_sync_args: '--resolution lowest-direct' # could also be 'direct'
            suite: pipeline-full
          - display_name: linux-lowest-direct-3.11-sqlalchemy-2
            vcpus: 8
            os: blacksmith-8vcpu-ubuntu-2404
            platform: linux-lowest-direct
            python-version: "3.11"
            shell: bash
            uv_sync_args: '--resolution lowest-direct' # could also be 'direct'
            suite: sqlalchemy-2

          # linux test with newest available allowed packages (will update lockfile, should not be committed if run locally)
          - display_name: linux-upgrade-3.11-common/pipeline-mindeps-workspace
            vcpus: 8
            os: blacksmith-8vcpu-ubuntu-2404
            platform: linux-upgrade
            python-version: "3.11"
            shell: bash
            uv_sync_args: '--upgrade' # could also be 'direct'
            suite: common/pipeline-mindeps-workspace
          - display_name: linux-upgrade-3.11-pipeline-full
            vcpus: 8
            os: blacksmith-8vcpu-ubuntu-2404
            platform: linux-upgrade
            python-version: "3.11"
            shell: bash
            uv_sync_args: '--upgrade' # could also be 'direct'
            suite: pipeline-full
          - display_name: linux-upgrade-3.11-sqlalchemy-2
            vcpus: 8
            os: blacksmith-8vcpu-ubuntu-2404
            platform: linux-upgrade
            python-version: "3.11"
            shell: bash
            uv_sync_args: '--upgrade' # could also be 'direct'
            suite: sqlalchemy-2

          # windows tests
          - display_name: windows-3.11-common/pipeline-mindeps-workspace
            vcpus: 8
            os: blacksmith-8vcpu-windows-2025
            platform: windows
            python-version: "3.11"
            shell: cmd
            suite: common/pipeline-mindeps-workspace
          - display_name: windows-3.11-pipeline-full
            vcpus: 8
            os: blacksmith-8vcpu-windows-2025
            platform: windows
            python-version: "3.11"
            shell: cmd
            suite: pipeline-full
          - display_name: windows-3.11-sqlalchemy-2
            vcpus: 8
            os: blacksmith-8vcpu-windows-2025
            platform: windows
            python-version: "3.11"
            shell: cmd
            suite: sqlalchemy-2
          - display_name: windows-3.13-common/pipeline-mindeps-workspace
            vcpus: 8
            os: blacksmith-8vcpu-windows-2025
            platform: windows
            python-version: "3.13"
            shell: cmd
            suite: common/pipeline-mindeps-workspace
          - display_name: windows-3.13-pipeline-full
            vcpus: 8
            os: blacksmith-8vcpu-windows-2025
            platform: windows
            python-version: "3.13"
            shell: cmd
            suite: pipeline-full
          - display_name: windows-3.13-sqlalchemy-2
            vcpus: 8
            os: blacksmith-8vcpu-windows-2025
            platform: windows
            python-version: "3.13"
            shell: cmd
            suite: sqlalchemy-2

    defaults:
      run:
        shell: ${{ matrix.shell }}
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out
        uses: actions/checkout@master

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install tzdata on windows
        run: |
          cd %USERPROFILE%
          curl https://data.iana.org/time-zones/releases/tzdata2021e.tar.gz --output tzdata.tar.gz
          mkdir tzdata
          tar --extract --file tzdata.tar.gz --directory tzdata
          mkdir %USERPROFILE%\Downloads\tzdata
          copy tzdata %USERPROFILE%\Downloads\tzdata
          curl https://raw.githubusercontent.com/unicode-org/cldr/master/common/supplemental/windowsZones.xml --output %USERPROFILE%\Downloads\tzdata\windowsZones.xml
        if: runner.os == 'Windows'

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true
          enable-cache: true

      - name: Install dependencies
        run: make install-common-core
        env:
          UV_SYNC_ARGS: ${{ matrix.uv_sync_args }}

      # --- common / pipeline-mindeps / workspace (sqlalchemy 1.4 path) ---
      - name: Run common tests with minimum dependencies
        run: make test-common-core
        env:
          PYTEST_XDIST_N: auto
        if: matrix.suite == 'common/pipeline-mindeps-workspace'

      - name: Run tools tests
        run: make test-tools
        if: matrix.suite == 'common/pipeline-mindeps-workspace'

      - name: Install min dependencies to import core source
        run: make install-common-source
        env:
          UV_SYNC_ARGS: ${{ matrix.uv_sync_args }}
        if: matrix.suite == 'common/pipeline-mindeps-workspace' || matrix.suite == 'pipeline-full' || matrix.suite == 'sqlalchemy-2'

      - name: Run min dependencies source tests
        run: make test-common-source
        if: matrix.suite == 'common/pipeline-mindeps-workspace'

      - name: Install duckdb dependencies
        run: make install-pipeline-min
        env:
          UV_SYNC_ARGS: ${{ matrix.uv_sync_args }}
        if: matrix.suite == 'common/pipeline-mindeps-workspace' || matrix.suite == 'pipeline-full' || matrix.suite == 'sqlalchemy-2'

      - name: Run pipeline tests with minimum deps
        run: make test-pipeline-min
        env:
          PYTEST_XDIST_N: auto
        if: matrix.suite == 'common/pipeline-mindeps-workspace'

      - name: Install pyarrow
        run: make install-pipeline-arrow
        if: (matrix.suite == 'common/pipeline-mindeps-workspace' || matrix.suite == 'pipeline-full' || matrix.suite == 'sqlalchemy-2') && matrix.python-version != '3.14'

      - name: Run pipeline tests with pyarrow but no pandas installed
        run: make test-pipeline-arrow
        if: matrix.suite == 'common/pipeline-mindeps-workspace' && matrix.python-version != '3.14'

      - name: Install workspace dependencies
        run: make install-workspace
        env:
          UV_SYNC_ARGS: ${{ matrix.uv_sync_args }}
        if: (matrix.suite == 'common/pipeline-mindeps-workspace' || matrix.suite == 'pipeline-full' || matrix.suite == 'sqlalchemy-2') && matrix.python-version != '3.14'

      - name: Run workspace tests
        run: make test-workspace
        env:
          PYTEST_XDIST_N: auto
        if: matrix.suite == 'common/pipeline-mindeps-workspace' && matrix.python-version != '3.14'

      # --- pipeline-full (install chain only, then full extract/pipeline suite) ---
      - name: Install pipeline and sources dependencies
        run: make install-pipeline-full
        env:
          UV_SYNC_ARGS: ${{ matrix.uv_sync_args }}
        if: (matrix.suite == 'pipeline-full' || matrix.suite == 'sqlalchemy-2') && matrix.python-version != '3.14'

      - name: Run extract and pipeline tests
        run: make test-pipeline-full
        env:
          PYTEST_XDIST_N: auto
        if: matrix.suite == 'pipeline-full' && matrix.python-version != '3.14'

      # --- sqlalchemy 2 (sql_database + pyiceberg libs) ---
      - name: Upgrade sql alchemy
        run: make install-sqlalchemy2
        if: matrix.suite == 'sqlalchemy-2' && matrix.python-version != '3.14'

      - name: Run sql database tests and others that require sqlalchemy 2.0
        run: make test-with-sqlalchemy-2
        env:
          PYTEST_XDIST_N: auto
        if: matrix.suite == 'sqlalchemy-2' && matrix.python-version != '3.14'

  matrix_job_required_check:
    name: common-check
    needs: run_common
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check matrix job results
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "One or more matrix job tests failed or were cancelled. You may need to re-run them." && exit 1
