[project]
name = "test-workspace-deps-index"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "six>=1.16",
    "mpmath>=1.3 ; sys_platform == 'linux'",
    "mpmath<=1.3.0 ; sys_platform != 'linux'",
]

[dependency-groups]
tools = ["sympy>=1.12"]

[tool.uv.sources]
mpmath = [{ index = "pytorch", marker = "sys_platform == 'linux'" }]
sympy = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
