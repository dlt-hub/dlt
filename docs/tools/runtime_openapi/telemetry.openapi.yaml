  securitySchemes:
    BearerAuth:
      bearerFormat: JWT
      description: 'A short-lived data plane token sent as `Authorization: Bearer
        <token>`. API keys are not

        accepted here: exchange one for a token with

        `POST https://api.dlthub.com/api/v1/workspaces/{workspace_id}/-issue-dataplane-token`.'
      scheme: bearer
      type: http
info:
  description: "Telemetry of a workspace's pipelines: pipeline runs and their traces,\
    \ the load results of job runs, and per-pipeline and per-dataset statistics.\n\
    \n## Base URL and authentication\n\nEach workspace keeps its data on the data\
    \ plane of its region. Its services are not on\n`api.dlthub.com` and do not accept\
    \ API keys. To call them:\n\n1. Read `dataplane_url` from `GET https://api.dlthub.com/api/v1/workspaces/{workspace_id}`.\n\
    \   This is the base URL of every data plane service: Dataplane, Logs and Telemetry\
    \ API.\n2. Exchange your API key for a data plane token with\n   `POST https://api.dlthub.com/api/v1/workspaces/{workspace_id}/-issue-dataplane-token`.\n\
    \   The token is valid for one workspace until `expires_at`, currently 10 minutes\
    \ after it\n   was issued; request a new one before then. What it may do follows\
    \ your workspace role.\n3. Call the service at `dataplane_url` with `Authorization:\
    \ Bearer <token>`.\n\nThe data planes today:\n\n| Region | `dataplane_url` |\n\
    | --- | --- |\n| Europe (`eu1`, europe-west4) | `https://eu1.dlthub.com` |\n|\
    \ US East (`us1`, us-east4) | `https://us1.dlthub.com` |\n\n## Versioning\n\n\
    The API version is part of the path. Endpoints under `/v1` are stable: breaking\
    \ changes ship\nonly under a new version prefix. New endpoints, optional parameters\
    \ and response fields can\nbe added to `/v1` at any time, so ignore fields you\
    \ do not know."
  title: Telemetry Service
  version: 1.0.0
openapi: 3.1.0
paths:
  /telemetry/v1/workspaces/{workspace_id}/datasets/-/stats:
    get:
      deprecated: false
      description: '

        One row per dataset in the time range, with its aggregate metrics.


        Search with `q` over the dataset name, filter on what a row displays, and
        sort

        with paired `sort` and `order` lists.

        '
      operationId: list_dataset_stats
      parameters:
      - deprecated: false
        in: path
        name: workspace_id
        required: true
        schema:
          format: uuid
          type: string
      - allowEmptyValue: false
        allowReserved: false
        deprecated: false
        description: Maximum number of items to return. At most 1000.
        in: query
        name: limit
        required: false
        schema:
          default: 100
          description: Maximum number of items to return. At most 1000.
          maximum: 1000.0
          minimum: 1.0
          type: integer
      - allowEmptyValue: false
        allowReserved: false
        deprecated: false
        description: Number of items to skip. At most 10000; a list reports its total
          up to 10001, so narrow with filters instead of paging deeper.
        in: query
        name: offset
        required: false
        schema:
          default: 0
          description: Number of items to skip. At most 10000; a list reports its
            total up to 10001, so narrow with filters instead of paging deeper.
          maximum: 10000.0
          minimum: 0.0
          type: integer
      - allowEmptyValue: false
        allowReserved: false
        deprecated: false
        description: Start of period. Naive datetime (no offset), interpreted in `timezone`.
          E.g. `2026-03-01T00:00:00`. Defaults to 7 days before `end`.
        in: query
        name: start
        required: false
        schema:
          description: Start of period. Naive datetime (no offset), interpreted in
            `timezone`. E.g. `2026-03-01T00:00:00`. Defaults to 7 days before `end`.
          oneOf:
          - format: date-time
            type: string
          - type: 'null'
      - allowEmptyValue: false
        allowReserved: false
        deprecated: false
        description: End of period. Naive datetime (no offset), interpreted in `timezone`.
          E.g. `2026-03-11T00:00:00`. Defaults to now.
        in: query
        name: end
        required: false
        schema:
          description: End of period. Naive datetime (no offset), interpreted in `timezone`.
            E.g. `2026-03-11T00:00:00`. Defaults to now.
          oneOf:
          - format: date-time
            type: string
          - type: 'null'
      - allowEmptyValue: false
        allowReserved: false
        deprecated: false
        description: IANA timezone name (e.g. 'Europe/Berlin', 'America/New_York',
          'UTC'). Used for bucket alignment and interpreting `start`/`end`.
        in: query
        name: timezone
        required: false
        schema:
          default: UTC
          description: IANA timezone name (e.g. 'Europe/Berlin', 'America/New_York',
            'UTC'). Used for bucket alignment and interpreting `start`/`end`.
          type: string
      - allowEmptyValue: false
        allowReserved: false
        deprecated: false
        description: Case-insensitive substring match on `dataset_name`.
        in: query
        name: q
        required: false
        schema:
          description: Case-insensitive substring match on `dataset_name`.
          oneOf:
          - type: string
          - type: 'null'
      - allowEmptyValue: false
        allowReserved: false
        deprecated: false
        description: Exact match on `dataset_name`. Repeat the parameter to match
          any of several values.
        in: query
        name: dataset_name
        required: false
        schema:
          description: Exact match on `dataset_name`. Repeat the parameter to match
            any of several values.
          oneOf:
          - items:
              type: string
            type: array
          - type: 'null'
      - allowEmptyValue: false
        allowReserved: false
        deprecated: false
        description: Exact match on `latest_status`. Repeat the parameter to match
          any of several values.
        in: query
        name: latest_status
        required: false
        schema:
          description: Exact match on `latest_status`. Repeat the parameter to match
            any of several values.
          oneOf:
          - items:
              $ref: '#/components/schemas/PipelineRunStatus'
            type: array
          - type: 'null'
      - allowEmptyValue: false
        allowReserved: false
        deprecated: false
        description: Exact match on `latest_destination_name`. Repeat the parameter
          to match any of several values.
        in: query
        name: latest_destination_name
        required: false
        schema:
          description: Exact match on `latest_destination_name`. Repeat the parameter
            to match any of several values.
          oneOf:
          - items:
              type: string
            type: array
          - type: 'null'
      - allowEmptyValue: false
        allowReserved: false
        deprecated: false
        description: Keys to sort by, applied in the order given. Pairs positionally
          with `order`, which must have the same number of entries.
        in: query
        name: sort
