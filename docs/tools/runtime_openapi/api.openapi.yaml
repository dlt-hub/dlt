      - entry_point
      - execute
      - job_ref
      - triggers
      title: TJobDefinition
      type: object
    TJobObjectInput:
      properties:
        entity_type:
          oneOf:
          - enum:
            - job-runs
            - job
            - workspace
            - pipeline
            - dataset
            type: string
          - const: job-run
            type: string
        input:
          type: string
      required:
      - entity_type
      - input
      title: TJobObjectInput
      type: object
    TRequireSpec:
      properties:
        dependency_groups:
          items:
            type: string
          type: array
        instance:
          additionalProperties: {}
          type: object
        profile:
          type: string
        provider:
          type: string
        region:
          type: string
        static_egress_ips:
          type: boolean
        timezone:
          type: string
      required: []
      title: TRequireSpec
      type: object
    TTimeoutSpec:
      properties:
