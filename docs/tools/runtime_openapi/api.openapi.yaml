  /api/v1/workspaces/{workspace_id}/jobs/{job_id}/-pause:
    post:
      deprecated: false
      description: "\nPauses a job's scheduled runs. The scheduler stops starting\
        \ it, both on its own schedule\nand through a freshness cascade, which is\
        \ the same tick deferred until an upstream is fresh.\nEverything a user or\
        \ another job drives still runs: manual runs, ``trigger``, and\n``job.success:``\
        \ / ``job.fail:`` chains.\n\nOnly a job with a scheduled run can be paused\
        \ \u2014 pausing anything else would claim to stop\nruns that were never automatic.\
        \ Requests for a job without ``next_scheduled_run_at``, or for\nan archived\
        \ job, are rejected with 400.\n\nThe scheduler keeps advancing ``next_scheduled_run_at``\
        \ while paused, so resuming produces one\nrun covering the whole period. A\
        \ deploy that removes the schedule also removes the pause;\notherwise a deploy\
        \ leaves it alone. The public URL is untouched. This operation is idempotent.\n\
        \nRequires WRITE permission on the workspace level.\n"
