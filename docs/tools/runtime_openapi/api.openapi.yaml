          type: array
      required:
      - engine_version
      - name
      title: TAgentDefinition
      type: object
    TDeliverSpec:
      properties:
        deadline:
          type: string
        pipeline_name:
          type: string
        source_ref:
          type: string
      required: []
      title: TDeliverSpec
      type: object
    TEntryPoint:
      properties:
        function:
          oneOf:
          - type: string
          - type: 'null'
        job_type:
          enum:
          - batch
          - interactive
          - stream
          type: string
        launcher:
          type: string
        module:
          type: string
      required:
      - function
      - job_type
      - launcher
      - module
      title: TEntryPoint
      type: object
    TExecuteSpec:
      properties:
        concurrency:
          oneOf:
          - type: integer
          - type: 'null'
        intercept_signals:
          type: boolean
        timeout:
          oneOf:
          - $ref: '#/components/schemas/TTimeoutSpec'
          - type: 'null'
      required: []
      title: TExecuteSpec
      type: object
    TExposeSpec:
      properties:
        category:
          enum:
          - pipeline
          - mcp
          - dashboard
          - notebook
          - background_agent
          type: string
        display_name:
          type: string
        interface:
          enum:
          - gui
          - rest_api
          - mcp
          type: string
        manual:
          type: boolean
        object_input:
          $ref: '#/components/schemas/TJobObjectInput'
        starred:
          type: boolean
        tags:
          oneOf:
          - type: string
          - items:
              type: string
            type: array
      required: []
      title: TExposeSpec
      type: object
    TIntervalSpec:
      properties:
        end:
          oneOf:
          - type: string
          - format: date-time
            type: string
        mode:
          enum:
          - sequential
          - parallel
          type: string
        start:
          oneOf:
          - type: string
          - format: date-time
            type: string
      required:
      - start
      title: TIntervalSpec
      type: object
    TJobDefinition:
      description: Full job definition from dlt deployment manifest
      properties:
        access:
          $ref: '#/components/schemas/TWorkspaceAccess'
        agent:
          $ref: '#/components/schemas/TAgentDefinition'
        auto_refresh_pipeline_mode:
          enum:
          - drop_sources
          - drop_resources
          - drop_data
          type: string
        config_keys:
          items:
            type: string
          type: array
        default_trigger:
          type: string
        deliver:
          $ref: '#/components/schemas/TDeliverSpec'
        description:
          type: string
        engine_version:
          type: integer
        entry_point:
          $ref: '#/components/schemas/TEntryPoint'
        execute:
          $ref: '#/components/schemas/TExecuteSpec'
        expose:
          $ref: '#/components/schemas/TExposeSpec'
        freshness:
          items:
            type: string
          type: array
        incremental_mode:
          enum:
          - interval
          - pipeline
          type: string
        inputs:
          additionalProperties: {}
          type: object
        interval:
          $ref: '#/components/schemas/TIntervalSpec'
        job_ref:
          type: string
        output:
          additionalProperties: {}
          type: object
        refresh_propagation:
          enum:
          - always
          - auto
          - block
          type: string
        require:
          $ref: '#/components/schemas/TRequireSpec'
        triggers:
          items:
            type: string
