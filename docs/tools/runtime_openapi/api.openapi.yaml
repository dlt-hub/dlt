      type: object
    TWorkspaceAccess:
      properties:
        context:
          items:
            enum:
            - read
            - write
            - execute
            - deploy
            - all
            type: string
          type: array
        data:
          items:
            enum:
            - read
            - write
            - all
            type: string
          type: array
        local:
          items:
            enum:
            - read
            - write
            - execute
            - network
            - all
            type: string
          type: array
      required: []
      title: TWorkspaceAccess
      type: object
    TriggerJobsRequest:
      properties:
        dry_run:
          default: false
          description: If true, return the receipt the trigger would produce without
            creating runs.
          type: boolean
        job_ids:
          description: Jobs to trigger, each fired via its `default_trigger` (or `manual:<ref>`
            when it has none). At least one of `job_ids` or `selectors` must be non-empty.
          oneOf:
          - items:
              format: uuid
              type: string
            type: array
          - type: 'null'
        profile:
          description: Profile override for all triggered runs.
          oneOf:
          - type: string
          - type: 'null'
        refresh:
          default: false
          description: When true, every triggered job eagerly clears its prev_completed_run
            cascade and ships a refresh signal to the launcher. Skipped jobs are not
            refreshed.
          type: boolean
        selectors:
          description: 'Trigger selectors (fnmatch patterns) matched against each
            job''s triggers; a matching job fires the trigger it matched. Examples:
            ''tag:backfill'', ''schedule:*'', ''batch'', ''manual:jobs.mod.*''. At
            least one of `job_ids` or `selectors` must be non-empty.'
          oneOf:
          - items:
              type: string
            type: array
          - type: 'null'
      required: []
      title: TriggerJobsRequest
      type: object
    TriggerJobsResponse:
      properties:
        failed:
          description: Requested jobs that do not exist in the workspace.
          items:
            $ref: '#/components/schemas/BulkItemFailure'
          type: array
        skipped:
          description: Jobs that did not start; their `status` and `reasons` say why.
          items:
            $ref: '#/components/schemas/TriggeredJob'
          type: array
        succeeded:
          description: Jobs that started a run, or would in dry-run mode.
          items:
            $ref: '#/components/schemas/TriggeredJob'
          type: array
      required:
      - failed
      - skipped
      - succeeded
      title: TriggerJobsResponse
      type: object
    TriggerKind:
      description: "A kind of trigger a job declares, as the job manifest classifies\
        \ one.\n\n    Membership is independent: a job may declare a schedule, a tag\
        \ and a manual\n    trigger at once. MANUAL mirrors the manifest's `expose.manual`,\
        \ which is on\n    by default, so it holds for most jobs.\n    "
      enum:
      - schedule
      - every
      - once
      - webhook
      - http
      - job.success
      - job.fail
      - manual
      title: TriggerKind
      type: string
    TriggeredJob:
      properties:
        job_id:
          description: The ID of the matched job.
          format: uuid
          type: string
        job_ref:
          description: The job reference of the matched job.
          type: string
        job_run:
          description: Full run details when a run was created. None in dry_run mode
            or when skipped.
          oneOf:
          - $ref: '#/components/schemas/JobRunResponse'
          - type: 'null'
        job_run_id:
          description: The ID of the created run. None in dry_run mode or when skipped.
          oneOf:
          - format: uuid
            type: string
          - type: 'null'
        matched_triggers:
          description: All triggers that matched the selectors.
          items:
            type: string
          type: array
        reasons:
          description: Human-readable reasons explaining non-'triggered' statuses
            (e.g. which upstreams failed the freshness check). None when status is
            'triggered' or no reasons were captured.
          oneOf:
          - items:
              type: string
            type: array
          - type: 'null'
        status:
          default: triggered
          description: "Why the job did or did not start. 'skipped_fresh' \u2014 one\
            \ or more upstream freshness checks failed (see `reasons` for which upstreams).\
            \ 'skipped_upstream_pending' \u2014 upstream being re-run in same batch.\
            \ 'skipped_out_of_interval' \u2014 point-in-time trigger outside job.interval_start/end.\
            \ 'skipped_concurrency_limit' \u2014 active run count already at the job's\
            \ concurrency limit. 'skipped_already_covered' \u2014 scheduler/cascade\
            \ detected prior completed run already covers the period. 'skipped_trial_expired'\
            \ \u2014 trial period has ended for this organization. 'skipped_minutes_limit'\
            \ \u2014 organization has exceeded its cumulative runtime limit. 'skipped_org_concurrency_limit'\
            \ \u2014 organization has reached its maximum number of concurrent runs.\
            \ 'skipped_paused' \u2014 the job's scheduled runs are paused, so the\
            \ scheduler did not start this tick."
          oneOf:
          - enum:
            - triggered
            - skipped_fresh
            - skipped_upstream_pending
            - skipped_out_of_interval
            - skipped_concurrency_limit
            - skipped_already_covered
            - skipped_trial_expired
            - skipped_minutes_limit
            - skipped_org_concurrency_limit
            - skipped_paused
            - skipped_workspace_archived
            type: string
          - type: string
        trigger:
          description: The single trigger picked for this run.
          type: string
      required:
      - job_id
      - job_ref
      - matched_triggers
      - trigger
      title: TriggeredJob
      type: object
    UpdateWorkspaceRequest:
      properties:
        description:
          description: The description of the workspace
          oneOf:
          - type: string
          - type: 'null'
        name:
          description: The name of the workspace
          oneOf:
          - type: string
          - type: 'null'
      required: []
      title: UpdateWorkspaceRequest
      type: object
    WorkspaceMeResponse:
      properties:
        email:
          description: The email of the current user
          type: string
        organization:
          $ref: '#/components/schemas/OrganizationResponse'
        organization_membership_id:
          description: The ID of the organization member in the parent organization
          format: uuid
          type: string
        organization_role:
          description: The role of the user in the parent organization
          oneOf:
          - $ref: '#/components/schemas/OrganizationMembershipRole'
          - type: string
        user_id:
          description: The ID of the current user
          format: uuid
          type: string
        workspace:
          $ref: '#/components/schemas/WorkspaceResponse'
        workspace_role:
          description: The role of the user in this workspace
          oneOf:
          - $ref: '#/components/schemas/WorkspaceMembershipRole'
          - type: string
      required:
      - email
      - organization
      - organization_membership_id
      - organization_role
      - user_id
      - workspace
      - workspace_role
      title: WorkspaceMeResponse
      type: object
    WorkspaceMemberResponse:
      properties:
        email:
          description: The email of the user
          type: string
        id:
          description: The ID of the workspace membership
          format: uuid
          type: string
        name:
          description: Display name; null when the user has no name set.
          oneOf:
          - type: string
          - type: 'null'
        organization_membership_id:
          description: The ID of the member's organization membership, which `created_by`
            and `triggered_by` hold
          format: uuid
          type: string
        role:
          description: The role of the user in the workspace
          oneOf:
          - $ref: '#/components/schemas/WorkspaceMembershipRole'
          - type: string
        user_id:
          description: The ID of the user
          format: uuid
          type: string
      required:
      - email
      - id
      - organization_membership_id
      - role
      - user_id
      title: WorkspaceMemberResponse
      type: object
    WorkspaceMembershipResponse:
      properties:
        role:
          description: The role of the user in the workspace
          oneOf:
          - $ref: '#/components/schemas/WorkspaceMembershipRole'
          - type: string
        workspace:
          $ref: '#/components/schemas/WorkspaceResponse'
      required:
      - role
      - workspace
      title: WorkspaceMembershipResponse
      type: object
    WorkspaceMembershipRole:
      default: developer
      description: The role to assign to the user
      enum:
      - owner
      - developer
      - viewer
      title: WorkspaceMembershipRole
      type: string
    WorkspaceResponse:
      properties:
        archived_at:
          description: Timestamp when the workspace was archived; null when live.
            Archived workspaces reject all mutations except unarchive.
          oneOf:
          - description: datetime with the constraint that the value must have timezone
              info
            format: date-time
            type: string
          - type: 'null'
        created_at:
          description: datetime with the constraint that the value must have timezone
            info
          format: date-time
          type: string
        dataplane_id:
          description: Identifier of the data plane that holds this workspace's user
            data. Matches the subdomain of the plane's public entrypoint.
          type: string
        dataplane_url:
          description: Public base URL of the data plane that holds this workspace's
            user data (e.g. ``https://<dataplane_id>.dlthub.com``). Clients attach
            a DataplaneUserJwt (minted via POST /api/v1/workspaces/{id}/-issue-dataplane-token)
            when calling data-plane services (telemetry, logs) at this host.
          type: string
        description:
          description: The description of the workspace
          oneOf:
          - type: string
          - type: 'null'
        id:
          description: The unique ID of the entity
          format: uuid
          type: string
        is_playground:
          default: false
          description: Whether this is the user's auto-created personal playground
            workspace. Playgrounds are single-member and cannot be renamed or deleted.
          type: boolean
        name:
          description: The name of the workspace
          type: string
        organization_id:
          description: The ID of the parent organization
          format: uuid
          type: string
        predefined_profiles:
          additionalProperties:
            type: string
          description: 'Predefined profile names keyed by access level name, e.g.
            {''DATA_WRITE'': ''prod'', ''DATA_READ'': ''access''}'
          type: object
        updated_at:
          description: datetime with the constraint that the value must have timezone
            info
          format: date-time
          type: string
      required:
      - created_at
      - dataplane_id
      - dataplane_url
      - description
      - id
      - name
      - organization_id
      - updated_at
      title: WorkspaceResponse
      type: object
  securitySchemes:
    BearerAuth:
      description: "An API key sent as `Authorization: Bearer <api key>`. Create keys\
        \ in the\n[dltHub web app](https://app.dlthub.com): a personal key (`dlt_u_\u2026\
        `) acts as you, with\nyour roles in every organization and workspace you belong\
        \ to; a workspace key (`dlt_sa_\u2026`)\nacts for one workspace with a fixed\
        \ DEVELOPER or VIEWER role."
      scheme: bearer
      type: http
info:
  description: "REST API of the dltHub Runtime control plane: organizations, workspaces,\
    \ deployments, configurations, jobs and job runs. The `dlthub` CLI, the Python\
    \ SDK and the [dltHub web app](https://app.dlthub.com) are built on it.\n\n##\
    \ Base URL\n\n`https://api.dlthub.com`\n\n## Authentication\n\nSend an API key\
    \ as a bearer token:\n\n```text\nAuthorization: Bearer <api key>\n```\n\nCreate\
    \ keys in the [dltHub web app](https://app.dlthub.com). The plaintext key is shown\
    \ once,\nand deleting a key revokes it immediately.\n\n- **Personal keys** (`dlt_u_\u2026\
    `), under account settings, act as you, with your roles in every\n  organization\
    \ and workspace you belong to.\n- **Workspace keys** (`dlt_sa_\u2026`), under\
    \ workspace settings, act for one workspace with a fixed\n  DEVELOPER (deploy\
    \ and run jobs) or VIEWER (read-only) role. Use them for CI and other\n  automation.\n\
    \n## Data plane\n\nWorkspace variables, deployment and configuration files, run\
    \ logs and telemetry are kept on the data plane of the workspace's region and\
    \ served by the Dataplane, Logs and Telemetry APIs. `GET /api/v1/workspaces/{workspace_id}`\
    \ returns its address as `dataplane_url`, and `POST /api/v1/workspaces/{workspace_id}/-issue-dataplane-token`\
    \ the token to call it with.\n\n## Versioning\n\nThe API version is part of the\
    \ path. Endpoints under `/v1` are stable: breaking changes ship\nonly under a\
    \ new version prefix. New endpoints, optional parameters and response fields can\n\
    be added to `/v1` at any time, so ignore fields you do not know."
  title: dltHub Runtime API
  version: 1.0.0
openapi: 3.1.0
paths:
  /api/v1/dataplanes:
    get:
      deprecated: false
      description: List the data planes the operator has declared for this deployment.
      operationId: list_dataplanes
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataplaneCatalog'
          description: Request fulfilled, document follows
          headers:
            cache-control:
              deprecated: false
              required: false
              schema:
                type: string
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal Server Error
      summary: ListDataplanes
      tags:
      - dataplanes
  /api/v1/me:
    get:
      deprecated: false
      description: '

        Get the current user''s identity and organization memberships.


        Workspaces are listed per organization, via /organizations/{id}/me.


        On the first call for a user who has no organization yet, bootstraps a personal

        organization and a playground workspace, so a freshly authenticated user always

        gets a 200.


        Requires Authorization Header.

        '
      operationId: get_me
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
          description: Request fulfilled, document follows
          headers:
            cache-control:
              deprecated: false
              required: false
              schema:
                type: string
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal Server Error
      summary: GetMe
      tags:
      - me
  /api/v1/organizations:
    get:
      deprecated: false
      description: '

        Lists all organizations the current user is a member of, as a paginated list.


        Requires Authorization Header.

        '
      operationId: list_organizations
      parameters:
      - allowEmptyValue: false
        allowReserved: false
        deprecated: false
        description: Maximum number of items to return. At most 1000.
        in: query
        name: limit
        required: false
        schema:
          default: 100
          description: Maximum number of items to return. At most 1000.
          maximum: 1000.0
          minimum: 1.0
          type: integer
      - allowEmptyValue: false
        allowReserved: false
        deprecated: false
        description: Number of items to skip. At most 10000; a list reports its total
          up to 10001, so narrow with filters instead of paging deeper.
        in: query
        name: offset
        required: false
        schema:
          default: 0
          description: Number of items to skip. At most 10000; a list reports its
            total up to 10001, so narrow with filters instead of paging deeper.
          maximum: 10000.0
          minimum: 0.0
          type: integer
      - allowEmptyValue: false
        allowReserved: false
        deprecated: false
        description: Keys to sort by, applied in the order given. Pairs positionally
          with `order`, which must have the same number of entries.
        in: query
        name: sort
        required: false
        schema:
          description: Keys to sort by, applied in the order given. Pairs positionally
            with `order`, which must have the same number of entries.
          oneOf:
          - items:
              enum:
              - created_at
              - name
              type: string
            type: array
          - type: 'null'
      - allowEmptyValue: false
        allowReserved: false
        deprecated: false
        description: Sort directions, one per `sort` key and in the same order. Required
          whenever `sort` is supplied.
        in: query
        name: order
        required: false
        schema:
          description: Sort directions, one per `sort` key and in the same order.
            Required whenever `sort` is supplied.
          oneOf:
          - items:
              enum:
              - asc
              - desc
              type: string
            type: array
          - type: 'null'
      - allowEmptyValue: false
        allowReserved: false
        deprecated: false
        description: Opaque cursor from a previous response's `next_cursor`; returns
          the rows after it under the same `sort` and `order`. Mutually exclusive
          with `offset`.
        in: query
        name: cursor
        required: false
        schema:
          description: Opaque cursor from a previous response's `next_cursor`; returns
            the rows after it under the same `sort` and `order`. Mutually exclusive
            with `offset`.
          oneOf:
          - type: string
          - type: 'null'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListPage_OrganizationResponse_'
          description: Request fulfilled, document follows
          headers:
            cache-control:
              deprecated: false
              required: false
              schema:
                type: string
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad request syntax or unsupported method
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal Server Error
      summary: ListOrganizations
      tags:
      - organizations
  /api/v1/organizations/{organization_id}:
    get:
      deprecated: false
      description: '

        Gets information about an organization.


        Requires READ permission on the organization level.

        '
      operationId: get_organization
      parameters:
      - deprecated: false
        in: path
        name: organization_id
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationResponse'
          description: Request fulfilled, document follows
          headers:
            cache-control:
              deprecated: false
              required: false
              schema:
                type: string
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad request syntax or unsupported method
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal Server Error
      summary: GetOrganization
      tags:
      - organizations
  /api/v1/organizations/{organization_id}/-set-region:
    post:
      deprecated: false
      description: '

        Sets the organization''s region, its data plane. This is one-time and

        irreversible: a second attempt returns 409. An unknown dataplane_id returns
        400.


        Requires MANAGE_ORG permission on the organization level.

        '
      operationId: set_region_organization
      parameters:
      - deprecated: false
        in: path
        name: organization_id
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetRegionOrganizationRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationResponse'
          description: Request fulfilled, document follows
          headers:
