components:
  schemas:
    BulkItemFailure:
      properties:
        detail:
          description: Why it failed.
          type: string
        ref:
          description: The item that failed, by its id or natural key.
          type: string
      required:
      - detail
      - ref
      title: BulkItemFailure
      type: object
    CancelJobRunsRequest:
      properties:
        dry_run:
          default: false
          description: If true, return runs that would be cancelled without cancelling
            them.
          type: boolean
        job_run_ids:
          description: Runs to cancel; a run already in a terminal state is skipped.
          items:
            format: uuid
            type: string
          minItems: 1
          type: array
      required:
      - job_run_ids
      title: CancelJobRunsRequest
      type: object
    CancelJobRunsResponse:
      properties:
        failed:
          description: Requested runs that do not exist in the workspace.
          items:
            $ref: '#/components/schemas/BulkItemFailure'
          type: array
        skipped:
          description: Runs that were already in a terminal state.
          items:
            $ref: '#/components/schemas/CancelledJobRun'
          type: array
        succeeded:
          description: Runs that were cancelled (or would be in dry-run mode).
          items:
            $ref: '#/components/schemas/CancelledJobRun'
          type: array
      required:
      - failed
      - skipped
      - succeeded
      title: CancelJobRunsResponse
      type: object
    CancelledJobRun:
      properties:
        job_ref:
          description: Job reference of the cancelled run.
          type: string
        job_run_id:
          description: ID of the cancelled run.
          format: uuid
          type: string
        job_run_number:
          description: Run number.
          type: integer
        previous_status:
          description: Status of the run when the cancel request arrived.
          oneOf:
          - $ref: '#/components/schemas/RunStatus'
          - type: string
      required:
      - job_ref
      - job_run_id
      - job_run_number
      - previous_status
      title: CancelledJobRun
      type: object
    ConfigurationResponse:
      properties:
        content_hash:
          description: The hash of the file of the uploaded tarball
          type: string
        created_at:
          description: datetime with the constraint that the value must have timezone
            info
          format: date-time
          type: string
        created_by:
          description: The ID of the identity who created the entity
          format: uuid
          type: string
        file_count:
          description: The number of files in the uploaded tarball
          type: integer
        id:
          description: The unique ID of the entity
          format: uuid
          type: string
        profiles:
          description: The profiles found in the configuration files
          items:
            type: string
          type: array
        size_bytes:
          description: The size of the uploaded tarball in bytes
          type: integer
        updated_at:
          description: datetime with the constraint that the value must have timezone
            info
          format: date-time
          type: string
        version:
          description: The version of the deployment. Will increment for each new
            version of the entity
          type: integer
        workspace_id:
          description: The ID of the workspace the entity belongs to
          format: uuid
          type: string
      required:
      - content_hash
      - created_at
      - created_by
      - file_count
      - id
      - profiles
      - size_bytes
      - updated_at
      - version
      - workspace_id
      title: ConfigurationResponse
      type: object
    CreateJobRunRequest:
      properties:
        job_id:
          description: The ID of the job to run.
          format: uuid
          type: string
        mode:
          $ref: '#/components/schemas/RunMode'
        profile:
          description: The name of the profile to use for the run, will default to
            the default profile of the job.
          oneOf:
          - type: string
          - type: 'null'
        refresh:
          default: false
          description: When true, eagerly clear the job's prev_completed_run and all
            transitive freshness-graph downstream, then ship a refresh signal to the
            launcher so the job performs a full reload instead of processing the interval
            window.
          type: boolean
        skip_freshness:
          default: false
          description: 'When true, bypass freshness gating and start the run even
            if upstream freshness constraints are unmet. Default false: the run is
            skipped (status=''skipped_fresh'') when upstreams are not fresh. Use this
            opt-in only when the caller explicitly wants to run regardless of upstream
            state.'
          type: boolean
        trigger:
          description: The trigger that starts this run, must be one of the triggers
            defined in the job definition (e.g. manual:, schedule:0 8 * * *, tag:backfill).
          type: string
      required:
      - job_id
      - trigger
      title: CreateJobRunRequest
      type: object
    CreateWorkspaceRequest:
      properties:
        description:
          description: The description of the workspace
          oneOf:
          - type: string
          - type: 'null'
        name:
          description: The name of the workspace
          type: string
      required:
      - description
      - name
      title: CreateWorkspaceRequest
      type: object
    DataplaneCatalog:
      properties:
        items:
          description: The data planes the operator has declared.
          items:
            $ref: '#/components/schemas/DataplaneResponse'
          type: array
      required:
      - items
      title: DataplaneCatalog
      type: object
    DataplaneResponse:
      properties:
        description:
          description: Optional note shown in the picker.
          oneOf:
          - type: string
          - type: 'null'
        id:
          description: Plane id; matches the public subdomain.
          type: string
        name:
          description: Human-readable plane name.
          type: string
        region:
          description: Short region code (e.g. eu-central-1).
          type: string
      required:
      - id
      - name
      - region
      title: DataplaneResponse
      type: object
    DeployWorkspaceRequest:
      properties:
        deployment_module:
          description: Deployment module name. None = ad-hoc (no archival). '__deployment__'
            = standard deploy.
          oneOf:
          - type: string
          - type: 'null'
        description:
          description: Workspace description (from __deployment__ docstring). Only
            applied when deployment_module='__deployment__'.
          oneOf:
          - type: string
          - type: 'null'
        dry_run:
          default: false
          description: If true, return preview of changes without persisting.
          type: boolean
        job_definition_engine_version:
          description: Manifest engine version.
          type: integer
        job_definition_hash:
          description: Content hash of the deployment manifest for change detection.
          type: string
        jobs:
          description: Job definitions from the deployment manifest.
          items:
            additionalProperties: {}
            type: object
          type: array
      required:
      - job_definition_engine_version
      - job_definition_hash
      - jobs
      title: DeployWorkspaceRequest
      type: object
    DeployWorkspaceResponse:
      properties:
        deployment_module:
          description: The deployment module the deploy was scoped to.
          oneOf:
          - type: string
          - type: 'null'
        job_receipt:
          $ref: '#/components/schemas/JobsDeployReceipt'
        warnings:
          description: Validation warnings.
          items:
            type: string
          type: array
      required:
      - job_receipt
      - warnings
      title: DeployWorkspaceResponse
      type: object
    DeployedJob:
      properties:
        job:
          $ref: '#/components/schemas/JobResponse'
        outcome:
          $ref: '#/components/schemas/JobDeployOutcome'
        previous_version:
          description: The version an updated job had before the deploy.
          oneOf:
          - $ref: '#/components/schemas/JobVersionResponse'
          - type: 'null'
      required:
      - job
      - outcome
      title: DeployedJob
      type: object
    DeploymentResponse:
      properties:
        content_hash:
          description: The hash of the file of the uploaded tarball
          type: string
        created_at:
          description: datetime with the constraint that the value must have timezone
            info
          format: date-time
          type: string
        created_by:
          description: The ID of the identity who created the entity
          format: uuid
          type: string
        file_count:
          description: The number of files in the uploaded tarball
          type: integer
        id:
          description: The unique ID of the entity
          format: uuid
          type: string
        requirements_size_bytes:
          description: Size of the workspace requirements manifest blob in bytes
          type: integer
        size_bytes:
          description: The size of the uploaded tarball in bytes
          type: integer
        updated_at:
          description: datetime with the constraint that the value must have timezone
            info
          format: date-time
          type: string
        version:
          description: The version of the deployment. Will increment for each new
            version of the entity
          type: integer
        workspace_id:
          description: The ID of the workspace the entity belongs to
          format: uuid
          type: string
      required:
      - content_hash
      - created_at
      - created_by
      - file_count
      - id
      - requirements_size_bytes
      - size_bytes
      - updated_at
      - version
      - workspace_id
      title: DeploymentResponse
      type: object
    DetailedJobResponse:
      properties:
        created_at:
          description: datetime with the constraint that the value must have timezone
            info
          format: date-time
          type: string
        created_by:
          description: The ID of the identity who created the job
          format: uuid
          type: string
        current_version:
          description: The active job version, carrying its provider, instance size,
            and resolved hardware.
          oneOf:
          - $ref: '#/components/schemas/JobVersionResponse'
          - type: 'null'
        default_trigger:
          description: Primary trigger string (computed from job_definition)
          oneOf:
          - type: string
          - type: 'null'
        deployment_module:
          description: Deployment module name (e.g. __deployment__)
          oneOf:
          - type: string
          - type: 'null'
        description:
          description: The description of the job
          oneOf:
          - type: string
          - type: 'null'
        downstream_job_runs:
          description: Runs the job's last run triggered, newest first. Included only
            when `downstream_job_runs_limit` is requested; null otherwise. Empty when
            the last run triggered nothing, since a chained job fires only once its
            upstream run reaches a terminal state.
          oneOf:
          - items:
              $ref: '#/components/schemas/DownstreamJobRunResponse'
            type: array
          - type: 'null'
        freshness:
          description: Freshness constraint strings (computed from job_definition)
          oneOf:
          - items:
              type: string
            type: array
          - type: 'null'
        id:
          description: The unique ID of the entity
          format: uuid
          type: string
        interval_end:
          description: Upper bound of the bounded work window (from job_definition.interval.end).
            None means no upper bound; the schedule halts once the next tick would
            exceed it.
          oneOf:
          - description: datetime with the constraint that the value must have timezone
              info
            format: date-time
            type: string
          - type: 'null'
        interval_start:
          description: Lower bound of the bounded work window (from job_definition.interval.start).
            None means the job has no bounded window.
          oneOf:
          - description: datetime with the constraint that the value must have timezone
              info
            format: date-time
            type: string
          - type: 'null'
        is_archived:
          default: false
          description: Whether the job is archived and hidden from default listings
          type: boolean
        is_paused:
          default: false
          description: Whether the job's scheduled runs are paused. The scheduler
            skips it, both on its own schedule and through a freshness cascade; manual
            runs, `trigger` and `job.success:`/`job.fail:` chains are unaffected.
            Only a job with `next_scheduled_run_at` can be paused, and losing that
            schedule on a deploy clears the pause.
          type: boolean
        job_definition:
          $ref: '#/components/schemas/TJobDefinition'
        job_definition_engine_version:
          description: Manifest engine version for future migration
          type: integer
        job_definition_hash:
          description: Hash of the job definition for change detection
          type: string
        job_ref:
          description: Canonical job reference, unique per workspace
          type: string
        job_type:
          description: 'The type of the job: batch, interactive, or stream'
          oneOf:
          - $ref: '#/components/schemas/JobType'
          - type: string
        job_url:
          description: The URL where the job can be accessed if interactive
          oneOf:
          - type: string
          - type: 'null'
          readOnly: true
        latest_job_run:
          description: The last run of the job, is None if no run has been made
          oneOf:
          - $ref: '#/components/schemas/JobRunResponse'
          - type: 'null'
        name:
          description: Display name for the job
          oneOf:
          - type: string
          - type: 'null'
        next_scheduled_run_at:
          description: The next scheduled run of the job, is None if no schedule is
            set
          oneOf:
          - description: datetime with the constraint that the value must have timezone
              info
            format: date-time
            type: string
          - type: 'null'
        pipeline_name:
          description: Pipeline name this job operates on (computed from job_definition)
          oneOf:
          - type: string
          - type: 'null'
        profile:
          description: The profile the job runs under
          type: string
        public_secret:
          description: The secret UUID used to generate the public URL for this job
          oneOf:
          - format: uuid
            type: string
          - type: 'null'
        public_url:
          description: The public URL where the job can be accessed without authentication,
            is None if not enabled
          oneOf:
          - type: string
          - type: 'null'
          readOnly: true
        recent_job_runs:
          description: The job's most recent runs, newest first. Included only when
            `recent_job_runs_limit` is requested; null otherwise.
          oneOf:
          - items:
              $ref: '#/components/schemas/RecentJobRunResponse'
            type: array
          - type: 'null'
        triggers:
          description: Trigger strings for this job (computed from job_definition)
          oneOf:
          - items:
              type: string
            type: array
          - type: 'null'
        updated_at:
          description: datetime with the constraint that the value must have timezone
            info
          format: date-time
          type: string
        version:
          description: The current version of the job
          type: integer
        workspace_id:
          description: The ID of the workspace the job belongs to
          format: uuid
          type: string
      required:
      - created_at
      - created_by
      - id
      - job_definition
      - job_definition_engine_version
      - job_definition_hash
      - job_ref
      - job_type
      - job_url
      - profile
      - public_url
      - updated_at
      - version
      - workspace_id
      title: DetailedJobResponse
      type: object
    DetailedJobRunResponse:
      properties:
        configuration_id:
          description: The ID of the configuration that will be used when running
            the job
          format: uuid
          type: string
        created_at:
          description: datetime with the constraint that the value must have timezone
            info
          format: date-time
          type: string
        deployment_id:
          description: The ID of the deployment that will be used when running the
            job
          format: uuid
          type: string
        downstream_job_runs:
          description: Runs this run triggered, newest first. Included only when `downstream_job_runs_limit`
            is requested; null otherwise. Only runs started by this run's outcome
            are linked, so a manually started one is absent.
          oneOf:
          - items:
              $ref: '#/components/schemas/DownstreamJobRunResponse'
            type: array
          - type: 'null'
        duration_seconds:
          description: The duration of the run in seconds, may be fractional (null
            if not yet completed)
          oneOf:
          - type: number
          - type: 'null'
        finished_at:
          description: The time the run ended
          oneOf:
          - description: datetime with the constraint that the value must have timezone
              info
            format: date-time
            type: string
          - type: 'null'
        id:
          description: The unique ID of the entity
          format: uuid
          type: string
        interval_end:
          description: End of the interval being processed (for interval-based jobs)
          oneOf:
          - description: datetime with the constraint that the value must have timezone
              info
            format: date-time
            type: string
          - type: 'null'
        interval_start:
          description: Start of the interval being processed (for interval-based jobs)
          oneOf:
          - description: datetime with the constraint that the value must have timezone
              info
            format: date-time
            type: string
          - type: 'null'
        job:
          $ref: '#/components/schemas/JobResponse'
        job_version:
          $ref: '#/components/schemas/JobVersionResponse'
        job_version_id:
          description: The ID of the job version that will be used when running the
            job
          format: uuid
          type: string
        logs_url:
          description: A link to the logs of the run
          oneOf:
          - type: string
          - type: 'null'
        number:
          description: The number of the run. Will increment for each new run of the
            job
          type: integer
        pipeline_run_summaries:
          description: Pipeline run summaries linked to this job run, populated by
            telemetry
          items:
            $ref: '#/components/schemas/PipelineRunSummaryResponse'
          type: array
        previous_job_run_id:
          description: The ID of the upstream run that triggered this run (for job
            event triggers)
          oneOf:
          - format: uuid
            type: string
          - type: 'null'
        profile:
          description: The name of the profile that was used for the run
          type: string
        started_at:
          description: The time the run started
          oneOf:
          - description: datetime with the constraint that the value must have timezone
              info
            format: date-time
            type: string
          - type: 'null'
        status:
          description: The status of the run
          oneOf:
          - $ref: '#/components/schemas/RunStatus'
          - type: string
        trigger:
          description: The trigger that started this run (full TTrigger string, e.g.
            schedule:0 8 * * *, manual:, job.success:jobs.ref)
          type: string
        triggered_by:
          description: The ID of the identity who triggered the run if triggered manually
          oneOf:
          - format: uuid
            type: string
          - type: 'null'
        updated_at:
          description: datetime with the constraint that the value must have timezone
            info
          format: date-time
          type: string
        workspace_id:
          description: The ID of the workspace the run belongs to
          format: uuid
          type: string
      required:
      - configuration_id
      - created_at
      - deployment_id
      - duration_seconds
      - finished_at
      - id
      - job
      - job_version
      - job_version_id
      - logs_url
      - number
      - profile
      - started_at
      - status
      - trigger
      - triggered_by
      - updated_at
      - workspace_id
      title: DetailedJobRunResponse
      type: object
    DownstreamJobRunResponse:
      properties:
        category:
          description: The category the job declares in `expose.category`, null when
            it declares none. Callers that want one kind of downstream run, such as
            agents, filter on this.
          oneOf:
          - $ref: '#/components/schemas/JobCategory'
          - type: 'null'
        duration_seconds:
          description: The run duration in seconds, null if not finished (may be fractional)
          oneOf:
          - type: number
          - type: 'null'
        id:
          description: The run ID
          format: uuid
          type: string
        job_id:
          description: The ID of the job that ran
          format: uuid
          type: string
        job_ref:
          description: The job's canonical reference
          type: string
        name:
          description: The job's display name
          type: string
        number:
          description: The run number within the job
          type: integer
        started_at:
          description: When the run started, null if not yet started
          oneOf:
          - description: datetime with the constraint that the value must have timezone
              info
            format: date-time
            type: string
          - type: 'null'
        status:
          description: The status of the run
          oneOf:
          - $ref: '#/components/schemas/RunStatus'
          - type: string
        trigger:
          description: The trigger that started the downstream run
          type: string
      required:
      - id
      - job_id
      - job_ref
      - name
      - number
      - status
      - trigger
      title: DownstreamJobRunResponse
      type: object
    ErrorResponse:
      properties:
        code:
          description: Machine-readable error code, when the error has one
          type: string
        detail:
          description: Human-readable description of the error
          type: string
        extra:
          description: Additional error details (free-form)
        status_code:
          description: The HTTP status code
          type: integer
      title: ErrorResponse
      type: object
    InstanceSize:
      enum:
      - small
      - medium
      - large
      - xlarge
      title: InstanceSize
      type: string
    IssueDataplaneTokenWorkspaceResponse:
      properties:
        expires_at:
          description: Unix timestamp (seconds) when the token expires. Clients should
            refresh before this moment.
          type: integer
        token:
          description: "Signed DataplaneUserJwt; present in Authorization: Bearer\
            \ \u2026"
          type: string
      required:
      - expires_at
      - token
      title: IssueDataplaneTokenWorkspaceResponse
      type: object
    IssueUploadConfigurationResponse:
      properties:
        configuration_id:
          description: ID the uploaded configuration will be created under
          format: uuid
          type: string
        upload_token:
          description: DataplaneUserJwt to attach as Bearer on the upload POST
          type: string
        upload_url:
          description: Absolute URL on the data plane where bytes must be posted
          type: string
      required:
      - configuration_id
      - upload_token
      - upload_url
      title: IssueUploadConfigurationResponse
      type: object
    IssueUploadDeploymentResponse:
      properties:
        deployment_id:
          description: ID the uploaded deployment will be created under
          format: uuid
          type: string
        upload_token:
          description: DataplaneUserJwt to attach as Bearer on the upload POST
          type: string
        upload_url:
          description: Absolute URL on the data plane where bytes must be posted
          type: string
      required:
      - deployment_id
      - upload_token
      - upload_url
      title: IssueUploadDeploymentResponse
      type: object
    JobCategory:
      description: "The kind of job a manifest declares in `expose.category`.\n\n\
        \    Exclusive, and most jobs declare none. These are the declared values\
        \ only:\n    what an undeclared job counts as is the caller's rule, not this\
        \ enum's.\n    "
      enum:
      - pipeline
      - mcp
      - dashboard
      - notebook
      - background_agent
      title: JobCategory
      type: string
    JobDeployOutcome:
      description: What the deploy did to the job.
      enum:
      - created
      - updated
      - archived
      - unchanged
      title: JobDeployOutcome
      type: string
    JobResponse:
      description: The job as it stands after the deploy.
      properties:
        created_at:
          description: datetime with the constraint that the value must have timezone
            info
          format: date-time
          type: string
        created_by:
          description: The ID of the identity who created the job
          format: uuid
          type: string
        default_trigger:
          description: Primary trigger string (computed from job_definition)
          oneOf:
          - type: string
          - type: 'null'
        deployment_module:
          description: Deployment module name (e.g. __deployment__)
          oneOf:
          - type: string
          - type: 'null'
        description:
          description: The description of the job
          oneOf:
          - type: string
          - type: 'null'
        freshness:
          description: Freshness constraint strings (computed from job_definition)
          oneOf:
          - items:
              type: string
            type: array
          - type: 'null'
        id:
          description: The unique ID of the entity
          format: uuid
          type: string
        interval_end:
          description: Upper bound of the bounded work window (from job_definition.interval.end).
            None means no upper bound; the schedule halts once the next tick would
            exceed it.
          oneOf:
          - description: datetime with the constraint that the value must have timezone
              info
            format: date-time
            type: string
          - type: 'null'
        interval_start:
          description: Lower bound of the bounded work window (from job_definition.interval.start).
            None means the job has no bounded window.
          oneOf:
          - description: datetime with the constraint that the value must have timezone
              info
            format: date-time
            type: string
          - type: 'null'
        is_archived:
          default: false
          description: Whether the job is archived and hidden from default listings
          type: boolean
        is_paused:
          default: false
          description: Whether the job's scheduled runs are paused. The scheduler
            skips it, both on its own schedule and through a freshness cascade; manual
            runs, `trigger` and `job.success:`/`job.fail:` chains are unaffected.
            Only a job with `next_scheduled_run_at` can be paused, and losing that
            schedule on a deploy clears the pause.
          type: boolean
        job_definition:
          $ref: '#/components/schemas/TJobDefinition'
        job_definition_engine_version:
          description: Manifest engine version for future migration
          type: integer
        job_definition_hash:
          description: Hash of the job definition for change detection
          type: string
        job_ref:
          description: Canonical job reference, unique per workspace
          type: string
        job_type:
          description: 'The type of the job: batch, interactive, or stream'
          oneOf:
          - $ref: '#/components/schemas/JobType'
          - type: string
        job_url:
          description: The URL where the job can be accessed if interactive
          oneOf:
          - type: string
          - type: 'null'
          readOnly: true
        name:
          description: Display name for the job
          oneOf:
          - type: string
          - type: 'null'
        next_scheduled_run_at:
          description: The next scheduled run of the job, is None if no schedule is
            set
          oneOf:
          - description: datetime with the constraint that the value must have timezone
              info
            format: date-time
            type: string
