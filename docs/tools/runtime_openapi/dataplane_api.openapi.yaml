components:
  schemas:
    ConfigurationResponse:
      properties:
        content_hash:
          description: The hash of the file of the uploaded tarball
          type: string
        created_at:
          description: datetime with the constraint that the value must have timezone
            info
          format: date-time
          type: string
        created_by:
          description: The ID of the identity who created the entity
          format: uuid
          type: string
        file_count:
          description: The number of files in the uploaded tarball
          type: integer
        id:
          description: The unique ID of the entity
          format: uuid
          type: string
        profiles:
          description: The profiles found in the configuration files
          items:
            type: string
          type: array
        size_bytes:
          description: The size of the uploaded tarball in bytes
          type: integer
        updated_at:
          description: datetime with the constraint that the value must have timezone
            info
          format: date-time
          type: string
        version:
          description: The version of the deployment. Will increment for each new
            version of the entity
          type: integer
        workspace_id:
          description: The ID of the workspace the entity belongs to
          format: uuid
          type: string
      required:
      - content_hash
      - created_at
      - created_by
      - file_count
      - id
      - profiles
      - size_bytes
      - updated_at
      - version
      - workspace_id
      title: ConfigurationResponse
      type: object
    DeploymentResponse:
      properties:
        content_hash:
          description: The hash of the file of the uploaded tarball
          type: string
        created_at:
          description: datetime with the constraint that the value must have timezone
            info
          format: date-time
          type: string
        created_by:
          description: The ID of the identity who created the entity
          format: uuid
          type: string
        file_count:
          description: The number of files in the uploaded tarball
          type: integer
        id:
          description: The unique ID of the entity
          format: uuid
          type: string
        requirements_size_bytes:
          description: Size of the workspace requirements manifest blob in bytes
          type: integer
        size_bytes:
          description: The size of the uploaded tarball in bytes
          type: integer
        updated_at:
          description: datetime with the constraint that the value must have timezone
            info
          format: date-time
          type: string
        version:
          description: The version of the deployment. Will increment for each new
            version of the entity
          type: integer
        workspace_id:
          description: The ID of the workspace the entity belongs to
          format: uuid
          type: string
      required:
      - content_hash
      - created_at
      - created_by
      - file_count
      - id
      - requirements_size_bytes
      - size_bytes
      - updated_at
      - version
      - workspace_id
      title: DeploymentResponse
      type: object
    ErrorResponse:
      properties:
        code:
          description: Machine-readable error code, when the error has one
          type: string
        detail:
          description: Human-readable description of the error
          type: string
        extra:
          description: Additional error details (free-form)
        status_code:
          description: The HTTP status code
          type: integer
      title: ErrorResponse
      type: object
    ManifestFileResponse:
      properties:
        linkname:
          description: Symlink target; set for symlink entries only.
          oneOf:
          - type: string
          - type: 'null'
        relative_path:
          description: Path of the file inside the package.
          type: string
        sha3_256:
          description: Digest of the contents, or of `linkname` for a symlink.
          type: string
        size_bytes:
          description: Size of the file.
          type: integer
      required:
      - relative_path
      - sha3_256
      - size_bytes
      title: ManifestFileResponse
      type: object
    ManifestFilesResponse:
      properties:
        engine_version:
          description: Manifest engine version.
          type: integer
        files:
          description: The files in the package.
          items:
            $ref: '#/components/schemas/ManifestFileResponse'
          type: array
      required:
      - engine_version
      - files
      title: ManifestFilesResponse
      type: object
    PlainPublicVariable:
      properties:
        created_at:
          description: datetime with the constraint that the value must have timezone
            info
          format: date-time
          type: string
        created_by:
          description: User who created the variable
          format: uuid
          type: string
        name:
          description: Environment variable name
          maxLength: 256
          minLength: 1
          type: string
        type:
          const: plain
          description: Readable back
          type: string
        updated_at:
          description: datetime with the constraint that the value must have timezone
            info
          format: date-time
          type: string
        updated_by:
          description: User who last updated the variable
          format: uuid
          type: string
        value:
          description: Value as stored
          maxLength: 16384
          type: string
      required:
      - created_at
      - created_by
      - name
      - type
      - updated_at
      - updated_by
      - value
      title: PlainPublicVariable
      type: object
    PlainVariableUpsert:
      properties:
        name:
          description: 'Environment variable name. Names the runtime sets are rejected
            on write: DASHBOARD__SYNC_FROM_RUNTIME, HOME, PATH, PORT, PYTHONHOME,
            PYTHONPATH, PYTHONUNBUFFERED, RUNTIME__API_BASE_URL, RUNTIME__AUTH_TOKEN,
            RUNTIME__DATAPLANE_BASE_URL, RUNTIME__ORGANIZATION_ID, RUNTIME__RUN_ID,
            RUNTIME__WORKSPACE_ID, WORKSPACE__PROFILE, and anything starting with
            SEND__ARTIFACTS__, SYNC__ARTIFACTS__, DESTINATION__PLAYGROUND__, RUNTIME__DLTHUB_'
          maxLength: 256
          minLength: 1
          type: string
        type:
          const: plain
          description: Readable back
          type: string
        value:
          description: Value exported into the run environment; `""` is valid and
            delivered as set-but-empty
          maxLength: 16384
          type: string
      required:
      - name
      - type
      - value
      title: PlainVariableUpsert
      type: object
    ScopeVariablesResponse:
      properties:
        profile:
          description: Profile owning this scope; `null` is the workspace-wide scope
          oneOf:
          - type: string
          - type: 'null'
        variables:
          description: Variables in this scope, secrets redacted
          items:
            oneOf:
            - $ref: '#/components/schemas/PlainPublicVariable'
            - $ref: '#/components/schemas/SecretPublicVariable'
          type: array
      required:
      - profile
      - variables
      title: ScopeVariablesResponse
      type: object
    SecretPublicVariable:
      properties:
        created_at:
          description: datetime with the constraint that the value must have timezone
            info
          format: date-time
          type: string
        created_by:
          description: User who created the variable
          format: uuid
          type: string
        name:
          description: Environment variable name
          maxLength: 256
          minLength: 1
          type: string
        type:
          const: secret
          description: Write-only, never shown again
          type: string
        updated_at:
          description: datetime with the constraint that the value must have timezone
            info
          format: date-time
          type: string
        updated_by:
          description: User who last updated the variable
          format: uuid
          type: string
        value:
          description: Always `null` for a secret
          oneOf:
          - type: string
          - type: 'null'
      required:
      - created_at
      - created_by
      - name
      - type
      - updated_at
      - updated_by
      title: SecretPublicVariable
      type: object
    SecretVariableUpsert:
      properties:
        name:
          description: 'Environment variable name. Names the runtime sets are rejected
            on write: DASHBOARD__SYNC_FROM_RUNTIME, HOME, PATH, PORT, PYTHONHOME,
            PYTHONPATH, PYTHONUNBUFFERED, RUNTIME__API_BASE_URL, RUNTIME__AUTH_TOKEN,
            RUNTIME__DATAPLANE_BASE_URL, RUNTIME__ORGANIZATION_ID, RUNTIME__RUN_ID,
            RUNTIME__WORKSPACE_ID, WORKSPACE__PROFILE, and anything starting with
            SEND__ARTIFACTS__, SYNC__ARTIFACTS__, DESTINATION__PLAYGROUND__, RUNTIME__DLTHUB_'
          maxLength: 256
          minLength: 1
          type: string
        type:
          const: secret
          description: Write-only, never shown again
          type: string
        value:
          description: Value exported into the run environment; must not be empty
          maxLength: 16384
          minLength: 1
          type: string
      required:
      - name
      - type
      - value
      title: SecretVariableUpsert
      type: object
    UpdateWorkspaceVariablesRequest:
      properties:
        deletes:
          description: Variable names to remove
          items:
            type: string
          type: array
        profile:
          description: Scope to change; `null` targets the workspace-wide scope
          oneOf:
          - type: string
          - type: 'null'
        upserts:
          description: Variables to create or update
          items:
            oneOf:
            - $ref: '#/components/schemas/PlainVariableUpsert'
            - $ref: '#/components/schemas/SecretVariableUpsert'
          type: array
      required:
      - profile
      title: UpdateWorkspaceVariablesRequest
      type: object
    UpdatedVariablesResponse:
      properties:
        results:
          description: Outcome per requested variable
          items:
            $ref: '#/components/schemas/VariableChangeResult'
          type: array
      required:
      - results
      title: UpdatedVariablesResponse
      type: object
    UploadDeploymentRequest:
      properties:
        file:
          contentMediaType: application/octet-stream
          format: binary
          type: string
        requirements_file:
          contentMediaType: application/octet-stream
          format: binary
          type: string
      required:
      - file
      - requirements_file
      title: UploadDeploymentRequest
      type: object
    VariableChangeResult:
      properties:
        name:
          description: Environment variable name
          maxLength: 256
          minLength: 1
          type: string
        status:
          description: What happened to this variable
          oneOf:
          - enum:
            - upserted
            - removed
            - not_found
            type: string
          - type: string
      required:
      - name
      - status
      title: VariableChangeResult
      type: object
    WorkspaceVariablesResponse:
      properties:
        scopes:
          description: Workspace-wide scope first, then each profile scope holding
            variables
          items:
            $ref: '#/components/schemas/ScopeVariablesResponse'
          type: array
      required:
      - scopes
      title: WorkspaceVariablesResponse
      type: object
  securitySchemes:
    BearerAuth:
      bearerFormat: JWT
      description: 'A short-lived data plane token sent as `Authorization: Bearer
        <token>`. API keys are not

        accepted here: exchange one for a token with

        `POST https://api.dlthub.com/api/v1/workspaces/{workspace_id}/-issue-dataplane-token`.'
      scheme: bearer
      type: http
info:
  description: "Workspace data kept on the data plane: workspace variables and the\
    \ files of uploaded deployments and configurations.\n\n## Base URL and authentication\n\
    \nEach workspace keeps its data on the data plane of its region. Its services\
    \ are not on\n`api.dlthub.com` and do not accept API keys. To call them:\n\n1.\
    \ Read `dataplane_url` from `GET https://api.dlthub.com/api/v1/workspaces/{workspace_id}`.\n\
    \   This is the base URL of every data plane service: Dataplane, Logs and Telemetry\
    \ API.\n2. Exchange your API key for a data plane token with\n   `POST https://api.dlthub.com/api/v1/workspaces/{workspace_id}/-issue-dataplane-token`.\n\
    \   The token is valid for one workspace until `expires_at`, currently 10 minutes\
    \ after it\n   was issued; request a new one before then. What it may do follows\
    \ your workspace role.\n3. Call the service at `dataplane_url` with `Authorization:\
    \ Bearer <token>`.\n\nThe data planes today:\n\n| Region | `dataplane_url` |\n\
    | --- | --- |\n| Europe (`eu1`, europe-west4) | `https://eu1.dlthub.com` |\n|\
    \ US East (`us1`, us-east4) | `https://us1.dlthub.com` |\n\n## Versioning\n\n\
    The API version is part of the path. Endpoints under `/v1` are stable: breaking\
    \ changes ship\nonly under a new version prefix. New endpoints, optional parameters\
    \ and response fields can\nbe added to `/v1` at any time, so ignore fields you\
    \ do not know."
  title: Dataplane API Service
  version: 1.0.0
openapi: 3.1.0
paths:
  /api/v1/workspaces/{workspace_id}/configurations/{configuration_id}/-upload:
    post:
      deprecated: false
      description: 'Upload configuration tarball bytes. Auth: ``DataplaneUserJwt``
        with ``configuration:upload`` grant on the URL ``configuration_id``. Server
        parses the tarball, stores it + the files manifest in vault, then writes the
        row back to the CP API. Returns the freshly-created ``ConfigurationResponse``.'
      operationId: upload_configuration
      parameters:
      - deprecated: false
        in: path
        name: workspace_id
        required: true
        schema:
          format: uuid
          type: string
      - deprecated: false
        in: path
        name: configuration_id
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              properties:
                file:
                  contentMediaType: application/octet-stream
                  format: binary
                  type: string
              type: object
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationResponse'
          description: Request fulfilled, document follows
          headers:
            cache-control:
              deprecated: false
              required: false
              schema:
                type: string
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad request syntax or unsupported method
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal Server Error
      summary: UploadConfigurationBytes
      tags:
      - uploads
  /api/v1/workspaces/{workspace_id}/configurations/{configuration_id}/files:
    get:
      deprecated: false
      description: 'Return the files manifest for a configuration. Auth: ``DataplaneUserJwt``
        with a ``ws:read`` grant on the URL ``workspace_id``.'
      operationId: get_configuration_files
      parameters:
      - deprecated: false
        in: path
        name: workspace_id
        required: true
        schema:
          format: uuid
          type: string
      - deprecated: false
        in: path
        name: configuration_id
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManifestFilesResponse'
          description: Request fulfilled, document follows
          headers:
            cache-control:
              deprecated: false
              required: false
              schema:
                type: string
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad request syntax or unsupported method
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal Server Error
      summary: GetConfigurationFilesManifest
      tags:
      - files
  /api/v1/workspaces/{workspace_id}/deployments/{deployment_id}/-upload:
    post:
      deprecated: false
      description: 'Upload deployment tarball bytes. Auth: ``DataplaneUserJwt`` with
        ``deployment:upload`` grant on the URL ``deployment_id``. Server parses the
        tarball, stores it + the requirements + the files manifest in vault, then
        writes the row back to the CP API. Returns the freshly-created ``DeploymentResponse``.'
      operationId: upload_deployment
      parameters:
      - deprecated: false
        in: path
        name: workspace_id
        required: true
        schema:
          format: uuid
          type: string
      - deprecated: false
        in: path
        name: deployment_id
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UploadDeploymentRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentResponse'
          description: Request fulfilled, document follows
          headers:
            cache-control:
              deprecated: false
              required: false
              schema:
                type: string
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad request syntax or unsupported method
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal Server Error
      summary: UploadDeploymentBytes
      tags:
      - uploads
  /api/v1/workspaces/{workspace_id}/deployments/{deployment_id}/files:
    get:
      deprecated: false
      description: 'Return the files manifest for a deployment. Auth: ``DataplaneUserJwt``
        with a ``ws:read`` grant on the URL ``workspace_id``.'
      operationId: get_deployment_files
      parameters:
      - deprecated: false
        in: path
        name: workspace_id
        required: true
        schema:
          format: uuid
          type: string
      - deprecated: false
        in: path
        name: deployment_id
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManifestFilesResponse'
          description: Request fulfilled, document follows
          headers:
            cache-control:
              deprecated: false
              required: false
              schema:
                type: string
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad request syntax or unsupported method
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal Server Error
      summary: GetDeploymentFilesManifest
      tags:
      - files
  /api/v1/workspaces/{workspace_id}/variables:
    get:
      deprecated: false
      description: Every scope in one response, or a single scope with `scope_profile`
        or `is_workspace_scope=true`. Secret values always come back `null`, and a
        scope holding nothing reads as an empty list rather than a 404. Requires the
        `ws:variables-read` grant, which a workspace owner and a run's agent can obtain.
      operationId: list_workspace_variables
      parameters:
      - deprecated: false
        in: path
        name: workspace_id
        required: true
        schema:
          format: uuid
          type: string
      - allowEmptyValue: false
        allowReserved: false
        deprecated: false
        in: query
        name: scope_profile
        required: false
        schema:
          oneOf:
          - type: string
          - type: 'null'
      - allowEmptyValue: false
        allowReserved: false
        deprecated: false
        in: query
        name: is_workspace_scope
        required: false
        schema:
          oneOf:
          - type: boolean
          - type: 'null'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceVariablesResponse'
          description: Request fulfilled, document follows
          headers:
            cache-control:
              deprecated: false
              required: false
              schema:
                type: string
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad request syntax or unsupported method
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal Server Error
      summary: ListWorkspaceVariables
      tags:
      - variables
    patch:
      deprecated: false
      description: Create, update and delete variables in one scope, applied atomically.
        `profile` null targets the workspace-wide scope. Deleting a name that was
        not set is reported as `not_found` rather than failing the request.
      operationId: update_workspace_variables
      parameters:
      - deprecated: false
        in: path
        name: workspace_id
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWorkspaceVariablesRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdatedVariablesResponse'
          description: Request fulfilled, document follows
          headers:
            cache-control:
              deprecated: false
              required: false
              schema:
                type: string
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad request syntax or unsupported method
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal Server Error
      summary: ChangeWorkspaceVariables
      tags:
      - variables
security:
- BearerAuth: []
servers:
- url: /
